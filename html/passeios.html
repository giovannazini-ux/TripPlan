
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripPlan | Passeios</title>
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>

<header>
    <div class="logo">Trip<span>Plan.</span></div>
    <nav>
        <a href="/">Início</a>
        <a href="/explorar">Explorar</a>
        <a href="/viagens">Minhas viagens</a>
        <a href="/destinos">Destinos</a>
        <a href="/passeios" class="ativo">Passeios</a>
        <a href="/despesas">Despesas</a>
    </nav>
</header>

<main class="pagina-container">
    <section class="pagina-intro">
        <span class="etiqueta">SUAS EXPERIÊNCIAS</span>
        <h1>Meus passeios</h1>
        <p>Planeje atividades e registre o que deseja fazer durante cada viagem.</p>
    </section>

    <section class="formulario-container">
        <h2>Novo passeio</h2>

        <form id="formPasseio">
            <label for="nomePasseio">Nome do passeio</label>
            <input type="text" id="nomePasseio" required placeholder="Ex.: Visita ao Coliseu">

            <label for="dataPasseio">Data</label>
            <input type="date" id="dataPasseio" required>

            <label for="viagemPasseio">Viagem relacionada</label>
            <select id="viagemPasseio" required>
                <option value="">Selecione uma viagem</option>
            </select>

            <label for="descricaoPasseio">Descrição</label>
            <textarea id="descricaoPasseio" placeholder="Detalhes do passeio"></textarea>

            <button type="submit" class="botao-principal">Cadastrar passeio</button>
        </form>
    </section>

    <section class="lista-viagens"></section>
</main>

<footer><p>TripPlan — Organize suas viagens do seu jeito.</p></footer>
<script src="/script/script.js"></script>
</body>
</html>
