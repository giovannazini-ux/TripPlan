
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripPlan | Minhas viagens</title>
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>

<header>
    <div class="logo">Trip<span>Plan.</span></div>
    <nav>
        <a href="/">Início</a>
        <a href="/explorar">Explorar</a>
        <a href="/viagens" class="ativo">Minhas viagens</a>
        <a href="/destinos">Destinos</a>
        <a href="/passeios">Passeios</a>
        <a href="/despesas">Despesas</a>
    </nav>
</header>

<main class="pagina-container">
    <section class="pagina-intro">
        <span class="etiqueta">SEUS PLANOS DE VIAGEM</span>
        <h1>Minhas viagens</h1>
        <p>Cadastre suas viagens e organize cada detalhe da sua próxima aventura.</p>
    </section>

    <section class="formulario-container">
        <h2>Nova viagem</h2>

        <form id="formViagem">
            <label for="nome">Nome da viagem</label>
            <input type="text" id="nome" required placeholder="Ex.: Férias na Europa">

            <label for="destino">Destino principal</label>
            <input type="text" id="destino" required placeholder="Ex.: Itália">

            <div class="formulario-linha">
                <div>
                    <label for="data_ida">Data de ida</label>
                    <input type="date" id="data_ida" required>
                </div>
                <div>
                    <label for="data_volta">Data de volta</label>
                    <input type="date" id="data_volta" required>
                </div>
            </div>

            <label for="orcamento">Orçamento (R$)</label>
            <input type="number" id="orcamento" min="0.01" step="0.01" required>

            <button type="submit" class="botao-principal">Cadastrar viagem</button>
        </form>
    </section>

    <section class="lista-viagens"></section>
</main>

<footer><p>TripPlan — Organize suas viagens do seu jeito.</p></footer>
<script src="/script/script.js"></script>
</body>
</html>
