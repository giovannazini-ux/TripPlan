
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripPlan | Destinos</title>
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>

<header>
    <div class="logo">Trip<span>Plan.</span></div>
    <nav>
        <a href="/">Início</a>
        <a href="/explorar">Explorar</a>
        <a href="/viagens">Minhas viagens</a>
        <a href="/destinos" class="ativo">Destinos</a>
        <a href="/passeios">Passeios</a>
        <a href="/despesas">Despesas</a>
    </nav>
</header>

<main class="pagina-container">
    <section class="pagina-intro">
        <span class="etiqueta">LUGARES QUE VOCÊ VAI CONHECER</span>
        <h1>Meus destinos</h1>
        <p>Adicione as cidades e os países que fazem parte das suas viagens.</p>
    </section>

    <section class="formulario-container">
        <h2>Novo destino</h2>

        <form id="formDestino">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" required placeholder="Ex.: Roma">

            <label for="pais">País</label>
            <input type="text" id="pais" required placeholder="Ex.: Itália">

            <label for="viagem">Viagem relacionada</label>
            <select id="viagem" required>
                <option value="">Selecione uma viagem</option>
            </select>

            <label for="descricao">Descrição</label>
            <textarea id="descricao" placeholder="Informações sobre o destino"></textarea>

            <button type="submit" class="botao-principal">Cadastrar destino</button>
        </form>
    </section>

    <section class="lista-viagens"></section>
</main>

<footer><p>TripPlan — Organize suas viagens do seu jeito.</p></footer>
<script src="/script/script.js"></script>
</body>
</html>
