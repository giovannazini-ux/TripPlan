
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripPlan | Despesas</title>
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>

<header>
    <div class="logo">Trip<span>Plan.</span></div>
    <nav>
        <a href="/">Início</a>
        <a href="/explorar">Explorar</a>
        <a href="/viagens">Minhas viagens</a>
        <a href="/destinos">Destinos</a>
        <a href="/passeios">Passeios</a>
        <a href="/despesas" class="ativo">Despesas</a>
    </nav>
</header>

<main class="pagina-container">
    <section class="pagina-intro">
        <span class="etiqueta">CONTROLE SEUS GASTOS</span>
        <h1>Minhas despesas</h1>
        <p>Acompanhe os valores gastos e mantenha seu orçamento organizado.</p>
    </section>

    <section class="formulario-container">
        <h2>Nova despesa</h2>

        <form id="formDespesa">
            <label for="descricaoDespesa">Descrição</label>
            <input type="text" id="descricaoDespesa" required placeholder="Ex.: Passagem de avião">

            <label for="categoriaDespesa">Categoria</label>
            <select id="categoriaDespesa" required>
                <option value="">Selecione uma categoria</option>
                <option value="Transporte">Transporte</option>
                <option value="Hospedagem">Hospedagem</option>
                <option value="Alimentação">Alimentação</option>
                <option value="Passeios">Passeios</option>
                <option value="Outros">Outros</option>
            </select>

            <label for="valorDespesa">Valor (R$)</label>
            <input type="number" id="valorDespesa" min="0.01" step="0.01" required>

            <label for="viagemDespesa">Viagem relacionada</label>
            <select id="viagemDespesa" required>
                <option value="">Selecione uma viagem</option>
            </select>

            <button type="submit" class="botao-principal">Cadastrar despesa</button>
        </form>
    </section>

    <section class="lista-viagens"></section>
</main>

<footer><p>TripPlan — Organize suas viagens do seu jeito.</p></footer>
<script src="/script/script.js"></script>
</body>
</html>
